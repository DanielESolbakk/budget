name: 'Enforce DoR / DoD'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-dor-dod:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PR readiness via planning metadata
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const payload = context.payload;
            const pr = payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- dor-dod-marker -->';

            if (!pr) {
              core.info('No pull request payload found. Skipping.');
              return;
            }

            let cfg;
            try {
              const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
              const defaultBranch = repoInfo.default_branch;
              const { data: content } = await github.rest.repos.getContent({ owner, repo, path: '.github/dor-dod-config.json', ref: defaultBranch });
              const raw = Buffer.from(content.content, content.encoding || 'base64').toString();
              cfg = JSON.parse(raw);
              console.log('Loaded .github/dor-dod-config.json from', defaultBranch);
            } catch (e) {
              console.log('Could not load .github/dor-dod-config.json from default branch, using built-in defaults.', e.message || e);
              cfg = {
                labels: { skip: 'skip-dor-dod', enforce: 'enforce-dor-dod', needsGrooming: 'needs-grooming', typePrefix: 'type:', acException: 'ac-exception' },
                types: {
                  feature: { requireAC: true, requireFixtureVerification: true, requireACIdMapping: true },
                  test: { requireAC: true, requireFixtureVerification: true, requireACIdMapping: true }
                },
                exceptions: { requireJustificationSection: true, requireFollowUpIssueForACException: true }
              };
            }

            const skipLabel = (cfg.labels && cfg.labels.skip ? cfg.labels.skip : 'skip-dor-dod').toLowerCase();
            const enforceLabel = (cfg.labels && cfg.labels.enforce ? cfg.labels.enforce : 'enforce-dor-dod').toLowerCase();
            const needsGroomingLabel = (cfg.labels && cfg.labels.needsGrooming ? cfg.labels.needsGrooming : 'needs-grooming');
            const needsGroomingLabelLower = needsGroomingLabel.toLowerCase();
            const typePrefix = (cfg.labels && cfg.labels.typePrefix ? cfg.labels.typePrefix : 'type:').toLowerCase();
            const acExceptionLabel = (cfg.labels && cfg.labels.acException ? cfg.labels.acException : 'ac-exception').toLowerCase();
            const defaultTypeRules = { requireAC: true, requireFixtureVerification: true, requireACIdMapping: true };

            const resolveTypeRules = (type) => {
              if (cfg && cfg.types && cfg.types[type]) return { ...defaultTypeRules, ...cfg.types[type] };
              if (type === 'mixed' && cfg && cfg.types && cfg.types.feature) return { ...defaultTypeRules, ...cfg.types.feature };
              return defaultTypeRules;
            };

            const normalizeAcId = (value) => {
              const match = String(value || '').toUpperCase().match(/AC[-_\s]?(\d+)/i);
              if (!match) return null;
              return `AC-${match[1]}`;
            };

            const parseIssueReferences = (value) => {
              const refs = new Set();
              const text = String(value || '');
              const regex = /(?:^|[\s,(])(?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#(\d+)\b/g;

              let match;
              while ((match = regex.exec(text)) !== null) {
                refs.add(Number(match[1]));
              }

              return [...refs];
            };

            const extractPrSection = (markdown, heading) => {
              const escaped = String(heading || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`(^|\\n)##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, 'i');
              const match = String(markdown || '').match(regex);
              return match ? String(match[2] || '').trim() : '';
            };

            const parseStrictMappingRows = (sectionBody) => {
              const rows = [];
              const invalidLines = [];
              const lines = String(sectionBody || '').split(/\r?\n/);

              for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;
                if (/^\|\s*AC\s*ID\b/i.test(line) || /^\|\s*---/i.test(line)) continue;

                const bulletMatch = line.match(/^[-*]\s*(.+)$/);
                if (!bulletMatch) {
                  invalidLines.push(rawLine);
                  continue;
                }

                const payloadLine = bulletMatch[1].trim();
                const parts = payloadLine.split('|').map((part) => part.trim());
                if (parts.length !== 4) {
                  invalidLines.push(rawLine);
                  continue;
                }

                const acId = normalizeAcId(parts[0]);
                if (!acId) {
                  invalidLines.push(rawLine);
                  continue;
                }

                rows.push({
                  acId,
                  testLevel: parts[1],
                  testId: parts[2],
                  testFilePath: parts[3].replace(/^`|`$/g, '')
                });
              }

              return { rows, invalidLines };
            };

            const listMarkerComments = async (issueNumber) => {
              const comments = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber, per_page: 100 });
              return comments.data.filter((comment) => typeof comment.body === 'string' && comment.body.includes(marker));
            };

            const upsertMarkerComment = async (issueNumber, body) => {
              const markerComments = await listMarkerComments(issueNumber);
              if (markerComments.length === 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
                return;
              }

              const sorted = markerComments.sort((left, right) => new Date(left.created_at) - new Date(right.created_at));
              const primary = sorted[0];
              const stale = sorted.slice(1);

              await github.rest.issues.updateComment({ owner, repo, comment_id: primary.id, body });
              for (const comment of stale) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            };

            const clearMarkerComments = async (issueNumber) => {
              const markerComments = await listMarkerComments(issueNumber);
              for (const comment of markerComments) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            };

            const pr_number = pr.number;
            const { data: prIssue } = await github.rest.issues.get({ owner, repo, issue_number: pr_number });
            const prBody = prIssue.body || '';
            const prLabels = (prIssue.labels || []).map((l) => (typeof l === 'string' ? l : l.name).toLowerCase());

            if (prLabels.includes(skipLabel)) {
              console.log('Skipping DoR/DoD checks due to', skipLabel, 'label');
              return;
            }

            const files = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr_number, per_page: 300 });
            const changed = (files.data || []).map((f) => f.filename || '');
            const typeLabel = prLabels.find((label) => label.startsWith(typePrefix));
            let workType = 'unknown';
            if (typeLabel) {
              workType = typeLabel.split(':')[1];
            } else {
              const hasTests = changed.some((p) => p.startsWith('tests/') || p.includes('/tests/'));
              const hasNonTests = changed.some((p) => !(p.startsWith('tests/') || p.includes('/tests/')));
              if (hasTests && !hasNonTests) workType = 'test';
              else if (hasTests && hasNonTests) workType = 'mixed';
              else workType = 'feature';
            }

            const typeRules = resolveTypeRules(workType);
            const messages = [];
            const warnings = [];
            const hasAcException = prLabels.includes(acExceptionLabel);

            const acExceptionSectionMatch = prBody.match(/(^|\n)##\s*AC Exception Justification[\s\S]*?(?=\n##\s+|$)/i);
            const acExceptionSection = acExceptionSectionMatch ? acExceptionSectionMatch[0] : '';
            if (hasAcException && (!cfg.exceptions || cfg.exceptions.requireJustificationSection !== false)) {
              const reasonText = acExceptionSection.replace(/(^|\n)##\s*AC Exception Justification\s*/i, '').trim();
              if (!acExceptionSection || reasonText.length < 20) {
                messages.push(`The ${acExceptionLabel} label requires an "AC Exception Justification" section in the PR body with a clear reason.`);
              }
            }
            if (hasAcException && (!cfg.exceptions || cfg.exceptions.requireFollowUpIssueForACException !== false)) {
              if (!/#\d+/.test(acExceptionSection)) {
                messages.push(`The ${acExceptionLabel} label requires a follow-up issue reference (for example #123) inside the "AC Exception Justification" section.`);
              }
            }

            const linkedPlanningSection = extractPrSection(prBody, 'Linked Planning Issue');
            const primaryPlanningMatch = linkedPlanningSection.match(/Primary planning issue:\s*(.+)$/im);
            const primaryPlanningRefs = parseIssueReferences(primaryPlanningMatch ? primaryPlanningMatch[1] : '');
            const additionalPlanningMatch = linkedPlanningSection.match(/Additional planning issues:\s*(.+)$/im);
            const additionalPlanningRefs = parseIssueReferences(additionalPlanningMatch ? additionalPlanningMatch[1] : '');
            const aggregateAcScope = /(^|\n)\s*AC mapping scope\s*:\s*aggregate\b/i.test(linkedPlanningSection);

            if (!linkedPlanningSection) {
              messages.push("Include a 'Linked Planning Issue' section in the PR body to enable deterministic AC mapping.");
            }
            if (linkedPlanningSection && primaryPlanningRefs.length !== 1) {
              messages.push('Primary planning issue must include exactly one issue reference like #123 for AC traceability.');
            }

            const acSourceIssueRefs = primaryPlanningRefs.length === 1
              ? (aggregateAcScope ? [...new Set([primaryPlanningRefs[0], ...additionalPlanningRefs])] : [primaryPlanningRefs[0]])
              : [];
            const acSourceIssueData = [];

            for (const sourceIssueRef of acSourceIssueRefs) {
              try {
                const { data: sourceIssue } = await github.rest.issues.get({ owner, repo, issue_number: sourceIssueRef });
                const sourceLabels = (sourceIssue.labels || []).map((l) => (typeof l === 'string' ? l : l.name).toLowerCase());
                acSourceIssueData.push({ number: sourceIssueRef, body: sourceIssue.body || '', labels: sourceLabels });
              } catch (e) {
                messages.push(`Linked planning issue #${sourceIssueRef} could not be loaded for AC mapping.`);
              }
            }

            const referencedNumbers = parseIssueReferences(prBody);
            for (const num of new Set(referencedNumbers)) {
              try {
                const { data: refIssue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                const refLabels = (refIssue.labels || []).map((l) => (typeof l === 'string' ? l : l.name).toLowerCase());
                if (refLabels.includes('planning-invalid')) {
                  messages.push(`Linked planning issue #${num} is marked 'planning-invalid'. Fix that issue before merging.`);
                  break;
                }
              } catch (e) {
                // ignore inaccessible references that are not source planning issues
              }
            }

            if (typeRules.requireAC !== false && !hasAcException) {
              const mappingSection = extractPrSection(prBody, 'Acceptance Criteria to Test Mapping');
              if (!mappingSection) {
                messages.push("Pull request description must include 'Acceptance Criteria to Test Mapping'.");
              } else if (!mappingSection.trim()) {
                messages.push("'Acceptance Criteria to Test Mapping' section cannot be empty. Describe how this PR addresses each AC from the linked planning issue.");
              } else if (acSourceIssueData.length > 0) {
                // Soft check: Extract AC IDs from linked planning issues and warn if PR mapping doesn't mention any
                const acIds = new Set();
                const acIdRe = /\bAC[-_\s]?\d+\b/gi;
                for (const linked of acSourceIssueData) {
                  let acMatch;
                  while ((acMatch = acIdRe.exec(linked.body)) !== null) {
                    const normalized = normalizeAcId(acMatch[0]);
                    if (normalized) acIds.add(normalized);
                  }
                }

                // Check which AC IDs from the planning issue appear anywhere in the PR mapping section
                const mentionedAcIds = [];
                for (const acId of acIds) {
                  if (mappingSection.includes(acId)) {
                    mentionedAcIds.push(acId);
                  }
                }

                // Soft warning (not a failure): If some planning issue ACs are not mentioned in PR mapping
                if (acIds.size > 0 && mentionedAcIds.length < acIds.size) {
                  const unmentionedAcIds = Array.from(acIds).filter((id) => !mentionedAcIds.includes(id));
                  const sourceLabels = acSourceIssueData.map((src) => `#${src.number}`).join(', ');
                  warnings.push(
                    `Acceptance Criteria to Test Mapping may be incomplete. ` +
                    `Planning issue(s) ${sourceLabels} define AC IDs: ${Array.from(acIds).sort().join(', ')}. ` +
                    `PR mapping mentions: ${mentionedAcIds.sort().join(', ')}. ` +
                    `Not mentioned: ${unmentionedAcIds.sort().join(', ')}. ` +
                    `This may be intentional (multi-PR work, out-of-scope), but please verify completeness.`
                  );
                }
              }
            }

            const fixtureChanged = changed.some((p) => p.startsWith('tests/fixtures/') || p.includes('/fixtures/') || p.includes('fixtures/'));
            if (fixtureChanged && typeRules.requireFixtureVerification !== false) {
              const verificationPresent = /verification-report\.json|verification-report/i.test(prBody);
              if (!verificationPresent) {
                messages.push('This PR modifies fixtures. Attach verification-report.json or link verification artifacts in PR description.');
              }
            }

            const prHeadRef = (pr && pr.head && pr.head.ref) ? pr.head.ref : '';
            const prTitle = (pr && pr.title) ? pr.title : (prIssue && prIssue.title ? prIssue.title : '');
            let shouldEnforce = false;
            if (prLabels.includes(enforceLabel)) shouldEnforce = true;
            if (cfg && cfg.strictTrigger) {
              const bPrefix = cfg.strictTrigger.branchPrefix || '';
              const titleContains = cfg.strictTrigger.prTitleContains || '';
              if (bPrefix && prHeadRef.startsWith(bPrefix)) shouldEnforce = true;
              if (titleContains && prTitle.includes(titleContains)) shouldEnforce = true;
            }

            if (messages.length > 0) {
              const body = `${marker}\nAutomation: DoD checks noticed issues:\n\n- ${messages.join('\n- ')}`;
              await upsertMarkerComment(pr_number, body);
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr_number, labels: [needsGroomingLabel] });

              if (shouldEnforce) {
                try {
                  await github.rest.pulls.createReview({ owner, repo, pull_number: pr_number, event: 'REQUEST_CHANGES', body: `DoD checks failed:\n\n- ${messages.join('\n- ')}` });
                } catch (e) {
                  core.info('Unable to create REQUEST_CHANGES review. Continuing with issue comment + failing status.');
                }
              }

              core.setFailed(`DoR/DoD validation failed with ${messages.length} issue(s).`);
              return;
            }

            await clearMarkerComments(pr_number);

            // If there are soft warnings but no hard failures, post as informational comment
            if (warnings.length > 0 && messages.length === 0) {
              const body = `${marker}\nAutomation: Soft checks (informational, not blocking):\n\n- ${warnings.join('\n- ')}`;
              await upsertMarkerComment(pr_number, body);
            }

            if (prLabels.includes(needsGroomingLabelLower)) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr_number, name: needsGroomingLabel });
              } catch (e) {
                core.info('No needs-grooming label to remove.');
              }
            }
