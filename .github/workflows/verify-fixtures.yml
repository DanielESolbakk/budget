name: Verify Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-fixture.ts"
      - "src/tooling/fixtures/**"
      - "tests/fixtures/synthetic/*.csv"
      - "tests/fixtures/verification-reports/**"
      - "docs/ways-of-work/plan/budget-planner/fixture-verification-report.md"
      - ".github/workflows/verify-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-fixture.ts"
      - "src/tooling/fixtures/**"
      - "tests/fixtures/synthetic/*.csv"
      - "tests/fixtures/verification-reports/**"
      - "docs/ways-of-work/plan/budget-planner/fixture-verification-report.md"
      - ".github/workflows/verify-fixtures.yml"

permissions:
  contents: read

jobs:
  verify-synthetic-fixtures:
    name: Verify synthetic CSV fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify synthetic CSV fixtures
        run: npm run verify-fixtures -- --input-dir tests/fixtures/synthetic --report-dir reports/fixture-verification

      - name: Upload fixture verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-verification-reports
          path: reports/fixture-verification
          if-no-files-found: ignore
