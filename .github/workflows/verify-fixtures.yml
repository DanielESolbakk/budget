name: Verify Fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-fixture.ts"
      - "src/tooling/fixtures/**"
      - "tests/fixtures/synthetic/*.csv"
      - "tests/fixtures/verification-reports/**"
      - "docs/ways-of-work/plan/budget-planner/fixture-verification-report.md"
      - ".github/workflows/verify-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-fixture.ts"
      - "src/tooling/fixtures/**"
      - "tests/fixtures/synthetic/*.csv"
      - "tests/fixtures/verification-reports/**"
      - "docs/ways-of-work/plan/budget-planner/fixture-verification-report.md"
      - ".github/workflows/verify-fixtures.yml"

permissions:
  contents: read

jobs:
  verify-synthetic-fixtures:
    name: Verify synthetic CSV fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify synthetic CSV fixtures
        id: verify
        shell: bash
        run: |
          mkdir -p reports/fixture-verification
          status=0
          shopt -s nullglob
          fixtures=(tests/fixtures/synthetic/*.csv)

          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo "No synthetic CSV fixtures found under tests/fixtures/synthetic/." >&2
            status=1
          fi

          for fixture in "${fixtures[@]}"; do
            report="reports/fixture-verification/$(basename "${fixture%.csv}").verification-report.json"
            if ! npm run verify-fixture -- --input "$fixture" --report "$report"; then
              status=1
            fi

            if ! node --input-type=module -e "import { existsSync, readFileSync } from 'node:fs'; const reportPath = process.argv[1]; if (!existsSync(reportPath)) { process.exit(1); } const report = JSON.parse(readFileSync(reportPath, 'utf8')); process.exit(report.ok === true ? 0 : 1);" "$report"; then
              status=1
            fi
          done

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload fixture verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-verification-reports
          path: reports/fixture-verification
          if-no-files-found: ignore

      - name: Fail when fixture verification report is unsuccessful
        if: steps.verify.outputs.status != '0'
        run: exit 1
