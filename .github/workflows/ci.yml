name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Determine Full CI Scope
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_harness_gate: ${{ steps.scope.outputs.run_harness_gate }}

    steps:
      - name: Determine if full CI should run
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("run_ci", "true");
              core.setOutput("run_full", "true");
              core.setOutput("run_harness_gate", "true");
              core.info("Full CI enabled for non-PR event.");
              return;
            }

            const payloadPr = context.payload.pull_request;
            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: payloadPr.number,
            });

            // Run CI only after the PR is out of draft (or when that transition event fires).
            const shouldRunCi = context.payload.action === "ready_for_review" || livePr.draft === false;
            core.setOutput("run_ci", shouldRunCi ? "true" : "false");

            if (!shouldRunCi) {
              core.setOutput("run_full", "false");
              core.setOutput("run_harness_gate", "false");
              core.info("Skipping CI while PR is draft. CI begins after ready_for_review.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: payloadPr.number,
              per_page: 100,
            });

            const shouldRunFull = files.some((file) => {
              const path = String(file.filename || "");
              return (
                path.startsWith("src/") ||
                path.startsWith("tests/") ||
                path.startsWith("scripts/") ||
                path === "package.json" ||
                path === "package-lock.json" ||
                path === "stryker.config.json" ||
                path === "tsconfig.json" ||
                /^vitest.*\.config\.ts$/i.test(path) ||
                path === ".github/workflows/ci.yml"
              );
            });

            const shouldRunHarnessGate = files.some((file) => {
              const path = String(file.filename || "");
              return (
                path.startsWith("src/tooling/performance/") ||
                path.startsWith("src/domain/import/") ||
                path === "scripts/run-skill-evals.ts" ||
                path === "scripts/run-backup-restore-benchmark.ts" ||
                path === "tests/integration/performance-harness-contract.test.ts" ||
                path === "tests/fixtures/synthetic/backup-restore-performance-contract.json" ||
                path === "tests/fixtures/synthetic/rogaland-2026-05-synthetic.csv" ||
                path === "package.json" ||
                path === "package-lock.json" ||
                path === ".github/workflows/ci.yml"
              );
            });

            core.setOutput("run_full", shouldRunFull ? "true" : "false");
            core.setOutput("run_harness_gate", shouldRunHarnessGate ? "true" : "false");
            core.info(`Full CI ${shouldRunFull ? "enabled" : "skipped"} based on changed files.`);
            core.info(`Harness eval gate ${shouldRunHarnessGate ? "enabled" : "skipped"} based on changed files.`);

  ci-fast:
    name: CI Fast
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require package manifest for code changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const pr = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const hasCodeChanges = files.some((file) => {
              const path = String(file.filename || "").toLowerCase();
              if (path.startsWith(".github/")) return false;
              if (/(^|\/)docs\//.test(path)) return false;
              if (/\.(md|txt|png|jpg|jpeg|gif|svg|webp)$/i.test(path)) return false;
              return true;
            });

            const hasPackageJson = fs.existsSync("package.json");
            if (hasCodeChanges && !hasPackageJson) {
              core.setFailed("Code changes require package.json so CI can enforce lint, typecheck, tests, and no-network verification.");
            }

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_package == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate required npm scripts
        if: steps.detect.outputs.has_package == 'true'
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const scripts=pkg.scripts||{}; const required=['lint','typecheck','test:unit']; const missing=required.filter((name)=>typeof scripts[name] !== 'string' || !scripts[name].trim()); if (missing.length){ console.error('Missing required npm scripts: '+missing.join(', ')); process.exit(1); }"

      - name: Lint
        if: steps.detect.outputs.has_package == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.detect.outputs.has_package == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.detect.outputs.has_package == 'true'
        run: npm run test:unit

      - name: No package marker
        if: steps.detect.outputs.has_package != 'true'
        run: echo "No package.json found. Docs-only and governance changes may proceed until scaffolding is created."

  ci-full:
    name: CI Full
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_ci == 'true' && needs.detect-changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_package == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate required npm scripts
        if: steps.detect.outputs.has_package == 'true'
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const scripts=pkg.scripts||{}; const has=(name)=>typeof scripts[name]==='string'&&scripts[name].trim(); const missing=['test:integration','test:e2e:playwright','verify:no-network','deps:audit:signal','ai:feedback:signal','ai:skills:prune:signal','ai:risk:checkpoint:signal'].filter((name)=>!has(name)); if(!(has('test:e2e:vitest')||has('test:e2e'))){ missing.push('test:e2e:vitest|test:e2e'); } if(process.env.RUN_HARNESS_GATE==='true' && !has('eval:skill')){ missing.push('eval:skill'); } if(missing.length){ console.error('Missing required npm scripts: '+missing.join(', ')); process.exit(1); }"
        env:
          RUN_HARNESS_GATE: ${{ needs.detect-changes.outputs.run_harness_gate }}

      - name: Harness eval gate
        if: steps.detect.outputs.has_package == 'true' && needs.detect-changes.outputs.run_harness_gate == 'true'
        run: npm run eval:skill

      - name: Integration tests
        if: steps.detect.outputs.has_package == 'true'
        run: npm run test:integration

      - name: Coverage thresholds signal (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run test:coverage:signal

      - name: Mutation score signal (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run test:mutation:signal

      - name: Upload mutation report artifact
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

      - name: Dependency governance signal (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run deps:audit:signal

      - name: Upload dependency governance artifact
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-governance
          path: reports/dependency-audit
          if-no-files-found: ignore

      - name: AI failure feedback loop (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run ai:feedback:signal

      - name: Upload AI feedback artifact
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-feedback
          path: reports/ai-feedback
          if-no-files-found: ignore

      - name: AI skill pruning loop (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run ai:skills:prune:signal

      - name: Upload AI skill pruning artifact
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-skill-pruning
          path: reports/ai-skill-pruning
          if-no-files-found: ignore

      - name: High-risk judgment checkpoint signal (non-blocking)
        if: steps.detect.outputs.has_package == 'true'
        continue-on-error: true
        run: npm run ai:risk:checkpoint:signal

      - name: Upload high-risk checkpoint artifact
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: high-risk-checkpoint
          path: reports/high-risk-checkpoint
          if-no-files-found: ignore

      - name: Vitest end-to-end smoke tests
        if: steps.detect.outputs.has_package == 'true'
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const scripts=pkg.scripts||{}; const has=(name)=>typeof scripts[name]==='string'&&scripts[name].trim(); const cmd=has('test:e2e:vitest')?'test:e2e:vitest':(has('test:e2e')?'test:e2e':''); if(!cmd){ console.error('No e2e script found (expected test:e2e:vitest or test:e2e).'); process.exit(1);} console.log(cmd);" > .e2e_cmd
          npm run "$(cat .e2e_cmd)"

      - name: Playwright runtime tests
        if: steps.detect.outputs.has_package == 'true'
        run: xvfb-run -a npm run test:e2e:playwright

      - name: Upload Playwright artifacts
        if: steps.detect.outputs.has_package == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: No-network verification
        if: steps.detect.outputs.has_package == 'true'
        run: npm run verify:no-network

      - name: Build packaged artifacts
        if: steps.detect.outputs.has_package == 'true'
        run: npm run build

      - name: Packaged runtime validation
        if: steps.detect.outputs.has_package == 'true'
        run: npm run validate:packaged-runtime

      - name: Backup/restore benchmark harness validation
        if: steps.detect.outputs.has_package == 'true'
        run: npm run benchmark:backup-restore -- --input tests/fixtures/synthetic/rogaland-2026-05-synthetic.csv

      - name: No package marker
        if: steps.detect.outputs.has_package != 'true'
        run: echo "No package.json found. Full CI checks are skipped."

  pr-guardrails:
    name: PR Guardrails
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce bug fix and testing policy
        uses: actions/github-script@v7
        with:
          script: |
            function extractSection(markdown, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`(^|\\n)##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, "i");
              const match = markdown.match(pattern);
              return match ? match[2].trim() : "";
            }

            function extractSections(markdown, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`(^|\\n)##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, "ig");
              const sections = [];
              let match;
              while ((match = pattern.exec(String(markdown || ""))) !== null) {
                sections.push(String(match[2] || "").trim());
              }
              return sections;
            }

            function parseChangeTypes(sectionBody) {
              const normalized = String(sectionBody || "").toLowerCase();
              const definitions = [
                { key: "feature", pattern: /(^|\n)\s*[-*]\s*\[[xX]\]\s*feature\s*($|\n)/i },
                { key: "bug fix", pattern: /(^|\n)\s*[-*]\s*\[[xX]\]\s*bug\s*fix\s*($|\n)/i },
                { key: "refactor", pattern: /(^|\n)\s*[-*]\s*\[[xX]\]\s*refactor\s*($|\n)/i },
                { key: "chore or docs", pattern: /(^|\n)\s*[-*]\s*\[[xX]\]\s*chore\s*or\s*docs\s*($|\n)/i },
              ];
              const selected = definitions
                .filter((entry) => entry.pattern.test(normalized))
                .map((entry) => entry.key);
              return selected;
            }

            function parseIssueRefs(value) {
              return [...new Set(
                [...String(value || "").matchAll(/(?:#|\/issues\/)(\d+)/gi)]
                  .map((match) => Number(match[1]))
                  .filter((number) => Number.isInteger(number) && number > 0)
              )];
            }

            const payloadPr = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: payloadPr.number,
            });

            const labels = (pr.labels || []).map((label) => String(label.name || "").toLowerCase());
            const title = String(pr.title || "");
            const bodyRaw = String(pr.body || "");
            const body = bodyRaw.toLowerCase();

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const hasBehavioralCodeChanges = files.some((file) => {
              const path = String(file.filename || "").toLowerCase();
              if (path.startsWith(".github/")) return false;
              if (/(^|\/)docs\//.test(path)) return false;
              return /(\.ts|\.tsx|\.js|\.jsx|\.sql|\.json)$/i.test(path) ||
                /^(src|app|electron|main|renderer|db|migrations|scripts)\//i.test(path);
            }
            );

            const hasTestChanges = files.some((file) =>
              /(^|\/)(__tests__|test|tests)\//i.test(file.filename) ||
              /(\.test\.|\.spec\.)/i.test(file.filename)
            );

            const changeTypeSections = extractSections(bodyRaw, "Change Type");
            const selectedChangeTypes = changeTypeSections.length > 0
              ? parseChangeTypes(changeTypeSections[changeTypeSections.length - 1])
              : parseChangeTypes(bodyRaw);

            if (selectedChangeTypes.length !== 1) {
              const diagnosticSection = (changeTypeSections[changeTypeSections.length - 1] || "").split(/\r?\n/).slice(0, 12).join(" | ");
              core.setFailed(
                `Select exactly one change type in the PR template. Detected selections: ${selectedChangeTypes.length ? selectedChangeTypes.join(", ") : "none"}. ` +
                `Using the last 'Change Type' section for evaluation to avoid run-time body-state drift. Parsed section preview: ${diagnosticSection || "<missing section>"}`
              );
              return;
            }

            const linkedPlanningSection = extractSection(bodyRaw, "Linked Planning Issue");
            if (!linkedPlanningSection) {
              core.setFailed("Pull request description must include the 'Linked Planning Issue' section.");
              return;
            }

            const primaryPlanningMatch = linkedPlanningSection.match(/Primary planning issue:\s*(.+)$/im);
            const primaryPlanningRefs = parseIssueRefs(primaryPlanningMatch ? primaryPlanningMatch[1] : "");
            if (primaryPlanningRefs.length !== 1) {
              core.setFailed("Primary planning issue must include exactly one issue reference like #123.");
              return;
            }

            const additionalPlanningMatch = linkedPlanningSection.match(/Additional planning issues:\s*(.+)$/im);
            const additionalPlanningRefs = parseIssueRefs(additionalPlanningMatch ? additionalPlanningMatch[1] : "");
            const planningIssueRefs = [...new Set([primaryPlanningRefs[0], ...additionalPlanningRefs])];

            for (const issueRef of planningIssueRefs) {
              let response;
              try {
                response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueRef,
                });
              } catch (error) {
                core.setFailed(`Linked planning issue #${issueRef} could not be loaded. Check that the issue exists and is accessible in this repository.`);
                return;
              }

              if (response.data.pull_request) {
                core.setFailed(`Linked planning reference #${issueRef} points to a pull request, not an issue.`);
                return;
              }

              const planningLabels = (response.data.labels || []).map((label) =>
                String(typeof label === "string" ? label : label.name || "").toLowerCase()
              );

              const isPlanningIssue = ["epic", "feature", "user-story", "enabler", "test"].some((label) =>
                planningLabels.includes(label)
              );
              if (!isPlanningIssue) {
                core.setFailed(`Linked planning issue #${issueRef} is missing a planning label such as epic, feature, user-story, enabler, or test.`);
                return;
              }

              if (planningLabels.includes("planning-invalid")) {
                core.setFailed(`Linked planning issue #${issueRef} is marked planning-invalid. Fix the issue hierarchy before merging this PR.`);
                return;
              }
            }

            const mappingSection = extractSection(bodyRaw, "Acceptance Criteria to Test Mapping");
            if (!mappingSection) {
              core.setFailed("Pull request description must include the 'Acceptance Criteria to Test Mapping' section.");
              return;
            }

            const normalizedMapping = mappingSection.replace(/\s+/g, " ").trim();
            if (/^(?:n\/a|na|none|not applicable|-|tbd)$/i.test(normalizedMapping)) {
              core.setFailed("Acceptance Criteria to Test Mapping cannot be empty or placeholder-only (for example: N/A, none, -, TBD).");
              return;
            }

            if (/\btbd\b/i.test(mappingSection)) {
              core.setFailed("Acceptance Criteria to Test Mapping cannot contain placeholder values like 'TBD'.");
              return;
            }

            const evidenceSection = extractSection(bodyRaw, "Test Evidence");
            if (!evidenceSection) {
              core.setFailed("Pull request description must include the 'Test Evidence' section.");
              return;
            }

            if (!/- \[[xX]\] npm run /i.test(evidenceSection)) {
              core.setFailed("Test Evidence must include at least one executed test or quality command checkbox marked with [x].");
              return;
            }

            // CI link validation removed: focus on AC mapping and test checkbox evidence only

            const isBugByLabel = labels.includes("bug");
            const isBugByTemplate = selectedChangeTypes.includes("bug fix");
            const isBugFix = isBugByLabel || isBugByTemplate;

            const bugSection = extractSection(bodyRaw, "Bug Fix Regression Test (required for bug fixes)");

            if (isBugFix && hasBehavioralCodeChanges && !hasTestChanges) {
              core.setFailed("Bug fix pull requests with code changes must include regression test file changes.");
              return;
            }

            if (isBugFix) {
              if (!bugSection) {
                core.setFailed("Bug fix pull requests must complete the 'Bug Fix Regression Test' section.");
                return;
              }

              if (/Regression test file\(s\):\s*$/im.test(bugSection)) {
                core.setFailed("Bug fix pull requests must provide regression test file paths.");
                return;
              }

              if (/What failed before this fix:\s*$/im.test(bugSection)) {
                core.setFailed("Bug fix pull requests must explain what failed before the fix.");
                return;
              }

              if (/Why this test prevents recurrence:\s*$/im.test(bugSection)) {
                core.setFailed("Bug fix pull requests must explain why the regression test prevents recurrence.");
              }
            }
