name: Advisory Test Quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Shared financial and import recovery mutation signal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683af # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Mutation signal (advisory score; execution failures remain visible)
        run: npm run test:mutation:quality:signal

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-quality
          path: reports/mutation-quality
          if-no-files-found: warn
          retention-days: 14
