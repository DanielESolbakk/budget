name: Planning Issue Validation

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, do not add/remove labels or post comments (manual scan only)'
        required: false
        default: 'false'

permissions:
  issues: write

jobs:
  planning-validate-fast:
    name: Planning Validation — Fast Checks
    runs-on: ubuntu-latest
    outputs:
      issue_type: ${{ steps.issue-type.outputs.type }}
      has_problems: ${{ steps.fast-check.outputs.has_problems }}

    steps:
      - name: Skip bot-triggered runs
        if: github.event.sender && github.event.sender.login == 'github-actions[bot]'
        run: |
          echo "Skipping bot-triggered run to avoid feedback loops."
          exit 0

      - name: Determine issue type
        id: issue-type
        uses: actions/github-script@v7
        with:
          script: |
            const getIssueType = require('./.github/scripts/getIssueType.js').getIssueType;
            
            const issue = context.payload.issue;
            if (!issue) return;
            
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const title = issue.title || '';
            const type = getIssueType(labels, title);
            
            core.setOutput('type', type || 'unknown');

      - name: Fast structure checks (headings, basic refs)
        id: fast-check
        uses: actions/github-script@v7
        with:
          script: |
            const { checkBasicStructure, parseIssueReferences } = require('./.github/scripts/planningChecks.js');
            const getIssueType = require('./.github/scripts/getIssueType.js').getIssueType;
            
            const issue = context.payload.issue;
            if (!issue) return;
            
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const title = issue.title || '';
            const type = getIssueType(labels, title);
            
            if (!type) {
              core.setOutput('has_problems', 'false');
              return;
            }
            
            const missing = checkBasicStructure(body, type);
            
            if (missing.length) {
              core.setOutput('has_problems', 'true');
              core.notice(`Fast check found ${missing.length} issues: ${missing.join('; ')}`);
            } else {
              core.setOutput('has_problems', 'false');
            }

  planning-validate-intensive:
    name: Planning Validation — Intensive Checks
    needs: planning-validate-fast
    if: needs.planning-validate-fast.outputs.issue_type != 'unknown'
    runs-on: ubuntu-latest

    steps:
      - name: Skip bot-triggered runs
        if: github.event.sender && github.event.sender.login == 'github-actions[bot]'
        run: |
          echo "Skipping bot-triggered run."
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run comprehensive planning validation
        uses: actions/github-script@v7
        with:
          script: |
            const { checkBasicStructure, parseIssueReferences, getSectionValue, normalizeValue, hasMeaningfulText } = require('./.github/scripts/planningChecks.js');
            const getIssueType = require('./.github/scripts/getIssueType.js').getIssueType;
            
            const marker = "<!-- planning-validation-marker -->";
            const invalidLabel = "planning-invalid";
            const issue = context.payload.issue;
            if (!issue) return;
            
            const body = issue.body || '';
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const title = issue.title || '';
            const { owner, repo } = context.repo;
            const issueNumber = issue.number;
            
            const issueType = getIssueType(labels, title);
            if (!issueType) return;
            
            const problems = [];
            const issueCache = new Map();
            
            // Basic structure checks (reuse fast-check results, or re-run for completeness)
            const basicProblems = checkBasicStructure(body, issueType);
            problems.push(...basicProblems);
            
            // Helper: Load issue with cache
            async function loadIssue(targetIssueNumber, heading) {
              if (issueCache.has(targetIssueNumber)) {
                return issueCache.get(targetIssueNumber);
              }
              try {
                const response = await github.rest.issues.get({
                  owner, repo, issue_number: targetIssueNumber,
                });
                issueCache.set(targetIssueNumber, response.data);
                return response.data;
              } catch (error) {
                issueCache.set(targetIssueNumber, null);
                problems.push(`${heading} references #${targetIssueNumber}, but that issue could not be loaded.`);
                return null;
              }
            }
            
            // Helper: Get labels from issue data
            function getLabelNames(issueData) {
              return (issueData.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            }
            
            // Validate single reference (epic, feature, etc.)
            async function validateSingleReference(heading, allowedLabels, required = true) {
              const rawValue = getSectionValue(body, heading);
              const references = parseIssueReferences(rawValue);
              
              if (references.length === 0) {
                if (required) {
                  problems.push(`${heading} must include an issue reference like #123.`);
                }
                return null;
              }
              
              if (references.length > 1) {
                problems.push(`${heading} must reference exactly one issue.`);
              }
              
              const targetIssue = await loadIssue(references[0], heading);
              if (!targetIssue) return null;
              
              if (targetIssue.pull_request) {
                problems.push(`${heading} must reference an issue, not a pull request.`);
                return null;
              }
              
              if (allowedLabels.length > 0) {
                const targetLabels = getLabelNames(targetIssue);
                const isAllowed = allowedLabels.some(labelName => targetLabels.includes(labelName));
                if (!isAllowed) {
                  const labelDesc = targetLabels.length ? targetLabels.join(", ") : "no labels";
                  problems.push(`${heading} must reference a ${allowedLabels.join(" or ")} issue, but #${targetIssue.number} has ${labelDesc}.`);
                }
              }
              
              return targetIssue;
            }
            
            // Validate multiple references (tests, enablers, etc.)
            async function validateMultiReference(heading, allowedLabels, required = true) {
              const rawValue = getSectionValue(body, heading);
              const references = parseIssueReferences(rawValue);
              
              if (references.length === 0) {
                if (required) {
                  problems.push(`${heading} must include at least one issue reference.`);
                }
                return [];
              }
              
              const resolvedIssues = [];
              for (const reference of references) {
                const targetIssue = await loadIssue(reference, heading);
                if (!targetIssue) continue;
                
                if (targetIssue.pull_request) {
                  problems.push(`${heading} must reference issues, not pull requests.`);
                  continue;
                }
                
                if (allowedLabels.length > 0) {
                  const targetLabels = getLabelNames(targetIssue);
                  const isAllowed = allowedLabels.some(labelName => targetLabels.includes(labelName));
                  if (!isAllowed) {
                    const labelDesc = targetLabels.length ? targetLabels.join(", ") : "no labels";
                    problems.push(`${heading} includes #${targetIssue.number}, but it has ${labelDesc} instead of ${allowedLabels.join(" or ")}.`);
                    continue;
                  }
                }
                
                resolvedIssues.push(targetIssue);
              }
              
              return resolvedIssues;
            }
            
            // Type-specific validation
            if (issueType === "epic") {
              const epicFeatures = await validateMultiReference("Features In This Epic", ["feature"]);
              const epicTests = await validateMultiReference("Test Issues In This Epic", ["test"]);
              const epicEnablers = await validateMultiReference("Enablers In This Epic", ["enabler"], false);
            }
            
            if (issueType === "feature") {
              const parentEpicIssue = await validateSingleReference("Parent Epic Issue", ["epic"]);
              const featureTests = await validateMultiReference("Test Issues In This Feature", ["test"]);
            }
            
            if (issueType === "story") {
              const parentEpicIssue = await validateSingleReference("Parent Epic Issue", ["epic"]);
              const parentFeatureIssue = await validateSingleReference("Parent Feature Issue", ["feature"]);
              const linkedTests = await validateMultiReference("Linked Test Issues", ["test"]);
              const linkedEnablers = await validateMultiReference("Linked Enabler Issues", ["enabler"]);
            }
            
            if (issueType === "enabler") {
              const parentEpicIssue = await validateSingleReference("Parent Epic Issue", ["epic"]);
              const parentFeatureIssue = await validateSingleReference("Parent Feature Issue", ["feature"]);
              const enabledStories = await validateMultiReference("Stories Enabled", ["user-story"]);
            }
            
            if (issueType === "test") {
              const parentEpicIssue = await validateSingleReference("Parent Epic Issue", ["epic"]);
              const scopeType = normalizeValue(getSectionValue(body, "Test Scope Type"));
              if (!scopeType) {
                problems.push("Test Scope Type must be selected.");
              }
            }
            
            // Label and comment management
            const actualLabels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            
            if (problems.length) {
              if (!actualLabels.includes(invalidLabel)) {
                try {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: issueNumber,
                    labels: [invalidLabel],
                  });
                } catch (e) {
                  core.warning(`Failed to add label to #${issueNumber}: ${e.message}`);
                }
              }
              
              // Dedupe and post/update single marker comment
              try {
                const comments = await github.rest.issues.listComments({
                  owner, repo, issue_number: issueNumber, per_page: 100,
                });
                const markerComments = comments.data.filter(c =>
                  c.body && c.body.includes(marker)
                );
                
                if (markerComments.length === 0) {
                  const comment = `${marker}\n**Planning Validation Failed**\n\n${problems.map(p => `- ${p}`).join('\n')}\n\nPlease update the issue to match the planning template: .github/ISSUE_TEMPLATE/`;
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber, body: comment,
                  });
                } else {
                  // Update first comment, delete others
                  const sorted = markerComments.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                  const primaryComment = sorted[0];
                  const toDelete = sorted.slice(1);
                  
                  const newBody = `${marker}\n**Planning Validation Failed**\n\n${problems.map(p => `- ${p}`).join('\n')}\n\nPlease update the issue to match the planning template: .github/ISSUE_TEMPLATE/`;
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: primaryComment.id, body: newBody,
                  });
                  
                  for (const oldComment of toDelete) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner, repo, comment_id: oldComment.id,
                      });
                    } catch (e) {
                      core.warning(`Failed to delete old comment ${oldComment.id}: ${e.message}`);
                    }
                  }
                }
              } catch (e) {
                core.warning(`Failed to manage comments for #${issueNumber}: ${e.message}`);
              }
            } else {
              // No problems: remove label and comments
              if (actualLabels.includes(invalidLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issueNumber, name: invalidLabel,
                  });
                } catch (e) {
                  if (e.status !== 404) {
                    core.warning(`Failed to remove label from #${issueNumber}: ${e.message}`);
                  }
                }
              }
              
              // Delete all marker comments
              try {
                const comments = await github.rest.issues.listComments({
                  owner, repo, issue_number: issueNumber, per_page: 100,
                });
                const markerComments = comments.data.filter(c =>
                  c.body && c.body.includes(marker)
                );
                
                for (const markerComment of markerComments) {
                  try {
                    await github.rest.issues.deleteComment({
                      owner, repo, comment_id: markerComment.id,
                    });
                  } catch (e) {
                    core.warning(`Failed to delete marker comment ${markerComment.id}: ${e.message}`);
                  }
                }
              } catch (e) {
                core.warning(`Failed to clean up comments for #${issueNumber}: ${e.message}`);
              }
            }
