name: Planning Issue Validation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: 'Comma-separated issue numbers to validate manually. Leave empty to use all_open_planning.'
        required: false
        default: ''
      all_open_planning:
        description: 'If true, validate all open planning issues.'
        required: false
        default: 'false'
      dry_run:
        description: 'If true, do not add/remove labels or post/delete comments.'
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read

jobs:
  planning-validate:
    name: Planning Issue Validation
    runs-on: ubuntu-latest

    steps:
      - name: Skip bot-triggered runs
        if: github.event.sender.type == 'Bot'
        run: |
          echo "Skipping bot-triggered run to avoid feedback loops."
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run planning validation
        uses: actions/github-script@v7
        with:
          script: |
            const {
              checkBasicStructure,
              parseIssueReferences,
              getSectionValue,
              normalizeValue,
            } = require('./.github/scripts/planningChecks.cjs');
            const getIssueType = require('./.github/scripts/getIssueType.cjs').getIssueType;

            const triggerLabel = 'validate-planning';
            const invalidLabel = 'planning-invalid';
            const needsGroomingLabel = 'needs-grooming';
            const marker = '<!-- planning-validation-marker -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const dryRun = eventName === 'workflow_dispatch'
              ? String(context.payload.inputs?.dry_run || 'false').toLowerCase() === 'true'
              : false;

            function isPlanningTypeLabel(label) {
              return ['epic', 'feature', 'user-story', 'enabler', 'test'].includes(label);
            }

            async function loadIssue(issueNumber) {
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              return response.data;
            }

            function getLabelNames(issueData) {
              return (issueData.labels || []).map((label) =>
                (typeof label === 'string' ? label : label.name).toLowerCase()
              );
            }

            async function updateMarkerComment(issueNumber, problems) {
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const markerComments = comments.data.filter((comment) =>
                typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (problems.length === 0) {
                for (const markerComment of markerComments) {
                  if (!dryRun) {
                    await github.rest.issues.deleteComment({
                      owner,
                      repo,
                      comment_id: markerComment.id,
                    });
                  }
                }
                return;
              }

              const body = `${marker}\n**Planning Validation Failed**\n\n${problems.map((problem) => `- ${problem}`).join('\n')}\n\nPlease update the issue to match the planning template: .github/ISSUE_TEMPLATE/`;

              if (markerComments.length === 0) {
                if (!dryRun) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body,
                  });
                }
                return;
              }

              const sorted = markerComments.sort((left, right) =>
                new Date(left.created_at) - new Date(right.created_at)
              );
              const primaryComment = sorted[0];
              const staleComments = sorted.slice(1);

              if (!dryRun) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: primaryComment.id,
                  body,
                });

                for (const staleComment of staleComments) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: staleComment.id,
                  });
                }
              }
            }

            async function ensureLabel(issueNumber, labelName, labelNames) {
              if (labelNames.includes(labelName)) {
                return;
              }
              if (!dryRun) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [labelName],
                });
              }
            }

            async function removeLabel(issueNumber, labelName, labelNames) {
              if (!labelNames.includes(labelName)) {
                return;
              }
              if (!dryRun) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: labelName,
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }
            }

            async function removeTriggerLabel(issueNumber, labelNames) {
              await removeLabel(issueNumber, triggerLabel, labelNames);
            }

            async function validateIssue(issueNumber) {
              const issueData = await loadIssue(issueNumber);

              if (issueData.pull_request) {
                core.info(`#${issueNumber} is a pull request. Skipping.`);
                return;
              }

              const labels = getLabelNames(issueData);
              const title = issueData.title || '';
              const body = issueData.body || '';
              const issueType = getIssueType(labels, title);

              const problems = [];
              const issueCache = new Map();

              if (!issueType) {
                problems.push('Planning issue must include one planning type label: epic, feature, user-story, enabler, or test.');
              } else {
                problems.push(...checkBasicStructure(body, issueType));
              }

              async function loadReferencedIssue(targetIssueNumber, heading) {
                if (issueCache.has(targetIssueNumber)) {
                  return issueCache.get(targetIssueNumber);
                }
                try {
                  const response = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: targetIssueNumber,
                  });
                  issueCache.set(targetIssueNumber, response.data);
                  return response.data;
                } catch (error) {
                  issueCache.set(targetIssueNumber, null);
                  problems.push(`${heading} references #${targetIssueNumber}, but that issue could not be loaded.`);
                  return null;
                }
              }

              async function validateSingleReference(heading, allowedLabels, required = true) {
                const rawValue = getSectionValue(body, heading);
                const references = parseIssueReferences(rawValue);

                if (references.length === 0) {
                  if (required) {
                    problems.push(`${heading} must include an issue reference like #123.`);
                  }
                  return null;
                }

                if (references.length > 1) {
                  problems.push(`${heading} must reference exactly one issue.`);
                }

                const targetIssue = await loadReferencedIssue(references[0], heading);
                if (!targetIssue) {
                  return null;
                }

                if (targetIssue.pull_request) {
                  problems.push(`${heading} must reference an issue, not a pull request.`);
                  return null;
                }

                const targetLabels = getLabelNames(targetIssue);
                const isAllowed = allowedLabels.some((label) => targetLabels.includes(label));
                if (!isAllowed) {
                  const labelDescription = targetLabels.length ? targetLabels.join(', ') : 'no labels';
                  problems.push(`${heading} must reference a ${allowedLabels.join(' or ')} issue, but #${targetIssue.number} has ${labelDescription}.`);
                }

                return targetIssue;
              }

              async function validateMultiReference(heading, allowedLabels, required = true) {
                const rawValue = getSectionValue(body, heading);
                const references = parseIssueReferences(rawValue);

                if (references.length === 0) {
                  if (required) {
                    problems.push(`${heading} must include at least one issue reference.`);
                  }
                  return;
                }

                for (const reference of references) {
                  const targetIssue = await loadReferencedIssue(reference, heading);
                  if (!targetIssue) {
                    continue;
                  }

                  if (targetIssue.pull_request) {
                    problems.push(`${heading} must reference issues, not pull requests.`);
                    continue;
                  }

                  const targetLabels = getLabelNames(targetIssue);
                  const isAllowed = allowedLabels.some((label) => targetLabels.includes(label));
                  if (!isAllowed) {
                    const labelDescription = targetLabels.length ? targetLabels.join(', ') : 'no labels';
                    problems.push(`${heading} includes #${targetIssue.number}, but it has ${labelDescription} instead of ${allowedLabels.join(' or ')}.`);
                  }
                }
              }

              if (issueType === 'epic') {
                await validateMultiReference('Features In This Epic', ['feature']);
                await validateMultiReference('Test Issues In This Epic', ['test']);
                await validateMultiReference('Enablers In This Epic', ['enabler'], false);
              }

              if (issueType === 'feature') {
                await validateSingleReference('Parent Epic Issue', ['epic']);
                await validateMultiReference('Test Issues In This Feature', ['test']);
              }

              if (issueType === 'story') {
                await validateSingleReference('Parent Epic Issue', ['epic']);
                await validateSingleReference('Parent Feature Issue', ['feature']);
                await validateMultiReference('Linked Test Issues', ['test']);
                await validateMultiReference('Linked Enabler Issues', ['enabler']);
              }

              if (issueType === 'enabler') {
                await validateSingleReference('Parent Epic Issue', ['epic']);
                await validateSingleReference('Parent Feature Issue', ['feature']);
                await validateMultiReference('Stories Enabled', ['user-story']);
              }

              if (issueType === 'test') {
                await validateSingleReference('Parent Epic Issue', ['epic']);
                const scopeType = normalizeValue(getSectionValue(body, 'Test Scope Type'));
                if (!scopeType) {
                  problems.push('Test Scope Type must be selected.');
                }
              }

              if (problems.length > 0) {
                await ensureLabel(issueNumber, invalidLabel, labels);
                await ensureLabel(issueNumber, needsGroomingLabel, labels);
              } else {
                await removeLabel(issueNumber, invalidLabel, labels);
                await removeLabel(issueNumber, needsGroomingLabel, labels);
              }

              await updateMarkerComment(issueNumber, problems);
              await removeTriggerLabel(issueNumber, labels);

              if (problems.length > 0) {
                core.warning(`#${issueNumber} failed planning validation with ${problems.length} problem(s).`);
              } else {
                core.info(`#${issueNumber} passed planning validation.`);
              }
            }

            async function resolveManualIssueNumbers() {
              const issueNumbersInput = String(context.payload.inputs?.issue_numbers || '').trim();
              const allOpenPlanning = String(context.payload.inputs?.all_open_planning || 'false').toLowerCase() === 'true';

              if (issueNumbersInput) {
                return [...new Set(
                  issueNumbersInput
                    .split(',')
                    .map((value) => Number(value.trim()))
                    .filter((value) => Number.isInteger(value) && value > 0)
                )];
              }

              if (!allOpenPlanning) {
                core.setFailed('workflow_dispatch requires either issue_numbers or all_open_planning=true.');
                return [];
              }

              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });

              return issues
                .filter((issue) => !issue.pull_request)
                .filter((issue) => {
                  const labels = getLabelNames(issue);
                  return labels.some(isPlanningTypeLabel);
                })
                .map((issue) => issue.number);
            }

            const issueNumbers = [];

            if (eventName === 'issues') {
              const changedLabel = String(context.payload.label?.name || '').toLowerCase();
              if (changedLabel !== triggerLabel) {
                core.info(`Ignoring issues event for label '${changedLabel}'.`);
                return;
              }

              const issueNumber = context.payload.issue?.number;
              if (!issueNumber) {
                core.setFailed('Issue event did not include an issue number.');
                return;
              }

              issueNumbers.push(issueNumber);
            } else if (eventName === 'workflow_dispatch') {
              issueNumbers.push(...await resolveManualIssueNumbers());
            }

            if (issueNumbers.length === 0) {
              core.info('No issues selected for validation.');
              return;
            }

            for (const issueNumber of issueNumbers) {
              await validateIssue(issueNumber);
            }
