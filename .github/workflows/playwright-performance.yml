name: Playwright Performance

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-performance:
    name: High-volume Playwright regressions
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Build application
        run: npm run build

      - name: High-volume Playwright tests
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/performance
          PLAYWRIGHT_REPORT_DIR: playwright-report/performance
        run: npm run test:e2e:playwright:ci -- --grep "@performance" --workers=2

      - name: Upload Playwright performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-performance-artifacts
          path: |
            playwright-report/performance
            test-results/performance
          if-no-files-found: ignore
