name: Feature
description: Create a user-facing feature issue linked to an epic. Keep feature scope separate from linked test issues.
title: "Feature: "
labels:
  - feature
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic Issue
      description: Link the parent epic issue.
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      placeholder: Summarize the feature and user-facing value.
    validations:
      required: true

  - type: textarea
    id: stories
    attributes:
      label: User Stories In This Feature
      placeholder: |
        - [ ] #201 Story: ...
        - [ ] #202 Story: ...
    validations:
      required: true

  - type: textarea
    id: enablers
    attributes:
      label: Technical Enablers
      placeholder: |
        - [ ] #301 Enabler: ...
        - [ ] #302 Enabler: ...
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Test Issues In This Feature
      description: Link explicit test issues for this feature. Do not absorb test-only work into the feature issue when a dedicated Test issue is appropriate.
      placeholder: |
        - [ ] #401 Test: Unit coverage for ...
        - [ ] #402 Test: Integration coverage for ...
        - [ ] #403 Test: End-to-end coverage for ...
    validations:
      required: true

  - type: textarea
    id: implementation_entry_points
    attributes:
      label: Implementation Entry Points
      description: Identify the likely modules, files, and boundaries for the first implementation slice.
      placeholder: |
        Likely files to change:
        - src/app/...
        - src/domain/...
        - tests/integration/...

        Files that should usually not change:
        - package.json
        - domain glossary
    validations:
      required: true

  - type: textarea
    id: validation_commands
    attributes:
      label: Validation Commands
      description: Provide the narrowest commands that validate the feature slice.
      placeholder: |
        - npm run test:integration
        - npm run test:e2e
    validations:
      required: true

  - type: textarea
    id: fixtures_and_examples
    attributes:
      label: Fixture Or Example Inputs
      description: Point to the sanitized or synthetic fixtures expected for this feature.
      placeholder: |
        - tests/fixtures/synthetic/...
        - None. UI shell only.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: |
        Blocks:
        Blocked by:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Use AC IDs so automation can verify PR traceability.
      placeholder: |
        - [ ] AC-1: ...
        - [ ] AC-2: ...
        - [ ] AC-3: ...
    validations:
      required: true

  - type: textarea
    id: test_mapping
    attributes:
      label: Acceptance Criteria To Test Mapping
      description: Map each AC ID to strict evidence rows using AC-ID | test-level | test-id | test-file-path.
      placeholder: |
        - AC-1 | integration | import ledger totals remain stable | tests/integration/importLedger.test.ts
        - AC-2 | e2e | low confidence review queue is visible | tests/e2e/workflow-smoke.test.ts
    validations:
      required: true

  - type: textarea
    id: triangle_coverage
    attributes:
      label: Test Automation Triangle Coverage
      description: Explain planned unit, integration, and Playwright coverage for this feature slice.
      placeholder: |
        - Unit: covered by linked story tests (#401, #402)
        - Integration: covered by #450
        - Playwright: deferred to #451 for dashboard flow
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      description: State what this feature intentionally does not cover in the current slice.
      placeholder: |
        - No live bank sync.
        - No charting redesign.
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: Use T-shirt size or story points.
      placeholder: M or 8 points
    validations:
      required: true
