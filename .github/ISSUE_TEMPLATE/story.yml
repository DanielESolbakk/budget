name: Story
description: Create a user story issue with explicit acceptance criteria and test mapping. Keep implementation work separate from standalone test work.
title: "Story: "
labels:
  - user-story
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic Issue
      description: Link the parent epic for traceability.
      placeholder: "#123"
    validations:
      required: true

  - type: input
    id: parent_feature
    attributes:
      label: Parent Feature Issue
      placeholder: "#456"
    validations:
      required: true

  - type: textarea
    id: story_statement
    attributes:
      label: Story Statement
      description: Use As a / I want / so that format.
      placeholder: "As a household user, I want ... so that ..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Use AC IDs so PR automation can validate AC-to-test mapping.
      placeholder: |
        - [ ] AC-1: ...
        - [ ] AC-2: ...
        - [ ] AC-3: ...
    validations:
      required: true

  - type: textarea
    id: technical_tasks
    attributes:
      label: Technical Tasks
      description: Describe the implementation work for the story. Keep dedicated test work in a linked Test issue unless this issue is explicitly test-only.
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: true

  - type: textarea
    id: implementation_entry_points
    attributes:
      label: Implementation Entry Points
      description: Identify the most likely files, modules, or folders to touch so the issue is self-contained for Copilot.
      placeholder: |
        Likely files to change:
        - src/domain/import/...
        - tests/integration/...

        Files that should usually not change:
        - src/domain/types.ts
        - docs/...
    validations:
      required: true

  - type: textarea
    id: validation_commands
    attributes:
      label: Validation Commands
      description: List the narrowest commands that should be run before widening scope.
      placeholder: |
        - npm run test:unit
        - npm run test:integration
    validations:
      required: true

  - type: textarea
    id: fixtures_and_examples
    attributes:
      label: Fixture Or Example Inputs
      description: Point to the sanitized or synthetic fixture, or explain why no fixture is needed.
      placeholder: |
        - tests/fixtures/synthetic/...
        - None. Pure logic change with in-memory inputs only.
    validations:
      required: true

  - type: textarea
    id: testing_requirements
    attributes:
      label: Testing Requirements
      description: Include explicit unit, integration, and Playwright end-to-end expectations. If validation work is substantial, link a dedicated Test issue rather than folding it into the story body.
      placeholder: |
        - [ ] Unit: covered by #401
        - [ ] Integration: covered by #402
        - [ ] Vitest E2E Smoke: covered by #403
        - [ ] Playwright Runtime E2E: deferred to #404 for runtime slice
    validations:
      required: true

  - type: textarea
    id: linked_enablers
    attributes:
      label: Linked Enabler Issues
      description: Link all required enablers for this story.
      placeholder: |
        - #301 Enabler: ...
        - #302 Enabler: ...
    validations:
      required: true

  - type: textarea
    id: linked_tests
    attributes:
      label: Linked Test Issues
      description: Link test issues that validate this story.
      placeholder: |
        - #401 Test: Unit coverage for ...
        - #402 Test: Integration coverage for ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: |
        Blocked by:
        Related to:
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      description: Name adjacent work that should not be pulled into this issue.
      placeholder: |
        - Do not redesign renderer architecture.
        - Do not add new persistence schema unless explicitly required.
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: Use story points.
      placeholder: 1, 2, 3, 5, 8
    validations:
      required: true
