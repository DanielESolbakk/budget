name: Test
description: Plan concrete test-only verification alongside approved implementation, including before product code exists. Record product prerequisites as blockers; planning does not imply assignment readiness.
title: "Test: "
labels:
  - test
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic Issue
      description: Link the parent epic for hierarchy traceability.
      placeholder: "#123"
    validations:
      required: true

  - type: dropdown
    id: scope_type
    attributes:
      label: Test Scope Type
      description: Select the planning level this test issue validates.
      options:
        - Story or Enabler
        - Feature
        - Epic-wide or Cross-cutting
    validations:
      required: true

  - type: input
    id: parent_feature
    attributes:
      label: Parent Feature Issue
      description: Required when Test Scope Type is Story or Enabler or Feature.
      placeholder: "#456"

  - type: input
    id: parent_item
    attributes:
      label: Parent Story Or Enabler Issue
      description: Required when Test Scope Type is Story or Enabler.
      placeholder: "#789"
    validations:
      required: false

  - type: textarea
    id: related_planning_issues
    attributes:
      label: Related Planning Issues
      description: Link any additional related planning issues, or explain why the epic is the only planning anchor.
      placeholder: |
        - #201 Story: ...
        - #301 Enabler: ...
        - None. This test is epic-wide and the parent epic is the only required anchor.
    validations:
      required: true

  - type: textarea
    id: parent_ac_ids
    attributes:
      label: Parent AC IDs Covered
      description: List each acceptance criterion from the immediate Parent Story Or Enabler Issue. AC numbers are local to that issue; do not copy AC IDs from Related Planning Issues or the Parent Feature Issue.
      placeholder: |
        - AC-1 (from #201)
        - AC-2 (from #201)
    validations:
      required: true

  - type: dropdown
    id: test_level
    attributes:
      label: Test Level
      options:
        - Unit
        - Integration
        - Playwright
        - End-to-end
        - Performance
        - Privacy and No-network
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Test Objective
      description: State the verification goal for this test issue. If the parent story or feature still needs implementation work, keep that work in the parent issue and reserve this issue for validation.
      placeholder: Describe what behavior this test work validates.
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: State which product behavior and test seams must exist before assignment. A concrete Test may be planned before those prerequisites are delivered.
      placeholder: |
        - Planned test-only scope for the approved parent Story; product implementation remains in that Story.
        - Keep needs-grooming and do not assign while the product prerequisites below are unresolved.
        - Before assignment, verify the parent behavior, runtime/IPC seams, and test harness exist.
    validations:
      required: true

  - type: textarea
    id: technical_tasks
    attributes:
      label: Technical Tasks
      description: List concrete test files or test-only helpers to create. Do not add missing product behavior from this issue.
      placeholder: |
        - [ ] Create tests/unit/example.test.ts with the scenarios and expected results below.
        - [ ] Add deterministic synthetic fixtures and regression assertions.
    validations:
      required: true

  - type: textarea
    id: fixtures
    attributes:
      label: Fixture Or Example Inputs
      description: Use sanitized or synthetic fixtures only.
      placeholder: |
        - Fixture type:
        - Source and sanitization note:
    validations:
      required: true

  - type: textarea
    id: implementation_entry_points
    attributes:
      label: Implementation Entry Points
      description: List existing test directories and available supporting modules. Put new files under Technical Tasks; put missing product behavior in linked implementation blockers.
      placeholder: |
        - tests/unit/
        - tests/fixtures/synthetic/
    validations:
      required: true

  - type: textarea
    id: validation_commands
    attributes:
      label: Validation Commands
      description: Give scoped executable commands for the planned coverage. Do not claim commands have passed before the tests exist.
      placeholder: |
        - npm run test:unit -- tests/unit/example.test.ts
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link product/runtime prerequisite issues explicitly. Open blockers prevent assignment, not creation of this planning record.
      placeholder: |
        #### Blocked by
        - #789
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      placeholder: |
        - Product implementation, which remains owned by the parent Story or Enabler.
        - Tests belonging to another verification layer.
    validations:
      required: true

  - type: textarea
    id: playwright_implementation_standards
    attributes:
      label: Playwright Implementation Standards
      description: Include this section only for Playwright runtime tests. Point to the canonical skill; do not copy its rules into the issue.
      placeholder: |
        Canonical contract: .agents/skills/playwright-skill/SKILL.md
        Test command: npm run test:e2e:playwright
        Required packs: core, ci, pom
        Runtime entry points: tests/playwright/ and tests/playwright/pom/
        Completion rule: stop and report a blocker if the assigned coverage cannot meet the canonical contract.
    validations:
      required: false

  - type: textarea
    id: scenarios
    attributes:
      label: Test Scenarios
      description: Include at least two reproducible scenarios with concrete expected results, not reserved coverage or placeholder cases.
      placeholder: |
        - [ ] Scenario 1
        - [ ] Scenario 2
    validations:
      required: true

  - type: textarea
    id: pass_criteria
    attributes:
      label: Pass Criteria
      description: Use AC IDs local to this test issue and retain the source parent reference in each criterion.
      placeholder: |
        - [ ] AC-1 (from #201): ...
        - [ ] AC-2 (from #201): ...
    validations:
      required: true

  - type: checkboxes
    id: regression_guard
    attributes:
      label: Regression Guard
      options:
        - label: This issue includes or references regression coverage for previously observed failures where applicable.
          required: true
