name: Test
description: Create a quality and verification issue linked to a story, enabler, feature, or epic-wide scope. Use this for test-only work instead of folding it into a story or feature issue.
title: "Test: "
labels:
  - test
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic Issue
      description: Link the parent epic for hierarchy traceability.
      placeholder: "#123"
    validations:
      required: true

  - type: dropdown
    id: scope_type
    attributes:
      label: Test Scope Type
      description: Select the planning level this test issue validates.
      options:
        - Story or Enabler
        - Feature
        - Epic-wide or Cross-cutting
    validations:
      required: true

  - type: input
    id: parent_feature
    attributes:
      label: Parent Feature Issue
      description: Required when Test Scope Type is Story or Enabler or Feature.
      placeholder: "#456"

  - type: input
    id: parent_item
    attributes:
      label: Parent Story Or Enabler Issue
      description: Required when Test Scope Type is Story or Enabler.
      placeholder: "#789"
    validations:
      required: false

  - type: textarea
    id: related_planning_issues
    attributes:
      label: Related Planning Issues
      description: Link any additional related planning issues, or explain why the epic is the only planning anchor.
      placeholder: |
        - #201 Story: ...
        - #301 Enabler: ...
        - None. This test is epic-wide and the parent epic is the only required anchor.
    validations:
      required: true

  - type: textarea
    id: parent_ac_ids
    attributes:
      label: Parent AC IDs Covered
      description: List each parent acceptance criterion this test issue validates.
      placeholder: |
        - AC-1 (from #201)
        - AC-2 (from #201)
    validations:
      required: true

  - type: dropdown
    id: test_level
    attributes:
      label: Test Level
      options:
        - Unit
        - Integration
        - End-to-end
        - Performance
        - Privacy and No-network
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Test Objective
      description: State the verification goal for this test issue. If the parent story or feature still needs implementation work, keep that work in the parent issue and reserve this issue for validation.
      placeholder: Describe what behavior this test work validates.
    validations:
      required: true

  - type: textarea
    id: fixtures
    attributes:
      label: Fixture Requirements
      description: Use sanitized or synthetic fixtures only.
      placeholder: |
        - Fixture type:
        - Source and sanitization note:
    validations:
      required: true

  - type: textarea
    id: implementation_entry_points
    attributes:
      label: Implementation Entry Points
      description: Identify the expected test files, supporting modules, and validation commands for this test work.
      placeholder: |
        Likely files to change:
        - tests/integration/...
        - src/tooling/fixtures/...

        Validation commands:
        - npm run test:integration
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: Test Scenarios
      placeholder: |
        - [ ] Scenario 1
        - [ ] Scenario 2
    validations:
      required: true

  - type: textarea
    id: pass_criteria
    attributes:
      label: Pass Criteria
      description: Use AC IDs local to this test issue for deterministic completion checks.
      placeholder: |
        - [ ] AC-1: ...
        - [ ] AC-2: ...
    validations:
      required: true

  - type: checkboxes
    id: regression_guard
    attributes:
      label: Regression Guard
      options:
        - label: This issue includes or references regression coverage for previously observed failures where applicable.
          required: true
